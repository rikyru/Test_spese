version: '3.8'

services:
  finance_app:
    build: .
    container_name: finance_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./finance_data:/app/data
      - ./ocr_models:/root/.EasyOCR
    environment:
      - DB_PATH=/app/data/finance.duckdb
      - RULES_PATH=/app/data/rules.yaml
      - INBOX_DIR=/app/data/inbox
    restart: unless-stopped

  finance_api:
    build: ./finance_api
    container_name: finance_api
    ports:
      - "8502:8000"
    volumes:
      # Il DB resta in sola lettura: l'API non scrive mai su DuckDB (lock del dashboard).
      - ./finance_data:/app/data:ro
      # Coda degli inserimenti dal telefono, drenata dal dashboard all'avvio.
      - ./finance_data/inbox:/app/inbox
    environment:
      - DB_PATH=/app/data/finance.duckdb
      - RULES_PATH=/app/data/rules.yaml
      - INBOX_DIR=/app/inbox
    restart: unless-stopped
